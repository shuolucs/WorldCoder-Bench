<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>P01 BUG M1 — 点击事件未绑定（球无法生成）</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { overflow: hidden; background: #0a0a0f; font-family: system-ui, sans-serif; }
  canvas { display: block; }
  #hud {
    position: fixed; top: 16px; left: 16px; color: #fff;
    background: rgba(0,0,0,0.55); padding: 14px 18px; border-radius: 10px;
    font-size: 14px; line-height: 1.7; backdrop-filter: blur(6px);
    border: 1px solid rgba(255,255,255,0.08); pointer-events: none;
  }
  #hud b { color: #7df; }
  .bug-tag { position: fixed; top: 8px; right: 8px; background: #ff3b30; color: #fff; padding: 4px 10px; border-radius: 6px; font-size: 12px; font-weight: 700; z-index: 99; }
</style>
</head>
<body>
<div class="bug-tag">BUG M1: click 事件未绑定</div>
<div id="hud">
  <div>球数: <b id="ballCount">0</b> / 30</div>
  <div>碰撞: <b id="collisionCount">0</b></div>
</div>
<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const GRAVITY = new THREE.Vector3(0, -15, 0);
const RESTITUTION = 0.75;
const BALL_RADIUS = 0.5;
const MAX_BALLS = 30;
const BOUNDS = { x: 10, z: 10, yMax: 20 };

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0a1a);
scene.fog = new THREE.Fog(0x0a0a1a, 25, 55);
const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 100);
camera.position.set(0, 10, 20);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.target.set(0, 3, 0);

scene.add(new THREE.AmbientLight(0x334466, 0.7));
const dl = new THREE.DirectionalLight(0xffeedd, 1.4);
dl.position.set(8, 15, 10); dl.castShadow = true;
dl.shadow.mapSize.set(2048, 2048);
scene.add(dl);

const floor = new THREE.Mesh(new THREE.BoxGeometry(20, 0.5, 20), new THREE.MeshStandardMaterial({ color: 0x222233 }));
floor.position.y = -0.25; floor.receiveShadow = true; scene.add(floor);

const wm = new THREE.MeshStandardMaterial({ color: 0x1a1a2e, transparent: true, opacity: 0.35 });
[[20,8,0.3,0,4,-10],[20,8,0.3,0,4,10],[0.3,8,20,-10,4,0],[0.3,8,20,10,4,0]].forEach(([w,h,d,x,y,z]) => {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), wm); m.position.set(x,y,z); scene.add(m);
});
scene.add(new THREE.GridHelper(20, 20, 0x333355, 0x222244));

const palette = [0xff4466, 0x44aaff, 0x44ff88, 0xffaa22, 0xdd44ff];
const balls = [];
let collisionCount = 0;

function createBall(pos, vel) {
  if (balls.length >= MAX_BALLS) return;
  const color = palette[balls.length % palette.length];
  const mesh = new THREE.Mesh(
    new THREE.SphereGeometry(BALL_RADIUS, 24, 24),
    new THREE.MeshStandardMaterial({ color, roughness: 0.25, metalness: 0.5 })
  );
  mesh.position.copy(pos); mesh.castShadow = true; scene.add(mesh);
  balls.push({ mesh, velocity: vel.clone(), radius: BALL_RADIUS });
  updateHUD();
}

function updateHUD() {
  document.getElementById('ballCount').textContent = balls.length;
  document.getElementById('collisionCount').textContent = collisionCount;
}

function wallCol(b) {
  const p = b.mesh.position, v = b.velocity, r = b.radius;
  if (p.y-r < 0) { p.y = r; v.y = Math.abs(v.y)*RESTITUTION; collisionCount++; }
  if (p.x-r < -BOUNDS.x) { p.x = -BOUNDS.x+r; v.x = Math.abs(v.x)*RESTITUTION; collisionCount++; }
  if (p.x+r > BOUNDS.x)  { p.x = BOUNDS.x-r;  v.x = -Math.abs(v.x)*RESTITUTION; collisionCount++; }
  if (p.z-r < -BOUNDS.z) { p.z = -BOUNDS.z+r; v.z = Math.abs(v.z)*RESTITUTION; collisionCount++; }
  if (p.z+r > BOUNDS.z)  { p.z = BOUNDS.z-r;  v.z = -Math.abs(v.z)*RESTITUTION; collisionCount++; }
}

const _n = new THREE.Vector3();
function ballCol(a, b) {
  _n.subVectors(b.mesh.position, a.mesh.position);
  const dist = _n.length(), minD = a.radius + b.radius;
  if (dist >= minD || dist < 1e-4) return;
  _n.divideScalar(dist);
  const overlap = minD - dist;
  a.mesh.position.addScaledVector(_n, -overlap*0.5);
  b.mesh.position.addScaledVector(_n, overlap*0.5);
  const rv = a.velocity.dot(_n) - b.velocity.dot(_n);
  if (rv <= 0) return;
  const j = rv * RESTITUTION;
  a.velocity.addScaledVector(_n, -j);
  b.velocity.addScaledVector(_n, j);
  collisionCount++;
}

/* ================================================
   BUG M1: click 事件监听器被删除了
   正确版本中这里有:
   renderer.domElement.addEventListener('click', e => { ... createBall(...) });
   现在这段代码不存在 → 点击场景无法生成新球
   ================================================ */

for (let i = 0; i < 5; i++) {
  createBall(
    new THREE.Vector3((Math.random()-0.5)*12, 3+Math.random()*6, (Math.random()-0.5)*12),
    new THREE.Vector3((Math.random()-0.5)*8, Math.random()*4, (Math.random()-0.5)*8)
  );
}

window.__3D_STATE__ = {};
const clock = new THREE.Clock();
(function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.033);
  for (const b of balls) {
    b.velocity.addScaledVector(GRAVITY, dt);
    b.velocity.multiplyScalar(0.999);
    b.mesh.position.addScaledVector(b.velocity, dt);
    wallCol(b);
  }
  for (let i = 0; i < balls.length; i++)
    for (let j = i+1; j < balls.length; j++) ballCol(balls[i], balls[j]);
  updateHUD();
  window.__3D_STATE__ = {
    ballCount: balls.length, collisionCount,
    balls: balls.map(b => ({ x: b.mesh.position.x, y: b.mesh.position.y, z: b.mesh.position.z })),
  };
  controls.update();
  renderer.render(scene, camera);
})();
window.addEventListener('resize', () => { camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
</script>
</body>
</html>
